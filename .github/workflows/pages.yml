name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # No build step: the site is plain HTML/CSS/JS. Copy only the public files.
      - name: Stage public files
        run: |
          mkdir _public
          rsync -a --exclude='.git*' --exclude='.github' --exclude='_public' --exclude='README.md' --exclude='.DS_Store' ./ _public/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
